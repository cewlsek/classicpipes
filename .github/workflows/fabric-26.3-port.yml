name: Fabric 26.3 port build
on:
  workflow_dispatch:
  push:
    branches: [fabric-26.3]
  pull_request:
    branches: [main]
jobs:
  fabric:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric
        run: ./gradlew :fabric:build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: classicpipes-fabric-build
          path: fabric/build/libs/*.jar
          if-no-files-found: error
