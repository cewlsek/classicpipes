plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // JEI
    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-${jei_minecraft}-fabric-api:${jei_version}")
    // at runtime, use the full JEI jar for Fabric
    runtimeOnly("mezz.jei:jei-${jei_minecraft}-fabric:${jei_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
// Minecraft 26.3 recipe advancement criteria use a recipes array rather than recipe.
// Rewrite copied resources (not source files) so the Fabric distribution loads worlds.
tasks.named('processResources') {
    doLast {
        def advancementDir = destinationDir.toPath().resolve('data/classicpipes/advancement/recipes').toFile()
        if (advancementDir.isDirectory()) {
            advancementDir.eachFileMatch(~/.*\.json/) { file ->
                def data = new groovy.json.JsonSlurper().parse(file)
                boolean changed = false
                data.criteria?.values()?.each { criterion ->
                    if (criterion.trigger == 'minecraft:recipe_unlocked' && criterion.conditions instanceof Map && criterion.conditions.containsKey('recipe')) {
                        criterion.conditions.recipes = [criterion.conditions.remove('recipe')]
                        changed = true
                    }
                }
                if (changed) {
                    file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
                }
            }
        }
    }
}
